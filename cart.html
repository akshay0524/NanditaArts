<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Art Cart — Nandita Arts</title>
  <meta name="description" content="Review your selected original paintings and museum-grade giclée prints. Secure studio checkout with Certificate of Authenticity.">
  <script>
    (function(){
      var s = localStorage.getItem('na_theme');
      var p = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', s || p);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/animations.css">
  <style>
    body { padding-top: var(--nav-height); background: var(--color-base); }
    .cart-page-wrap {
      min-height: calc(100vh - var(--nav-height));
      padding-block: var(--space-12) var(--space-24);
    }
    .cart-grid {
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: var(--space-10);
      align-items: start;
    }
    @media (max-width: 1024px) {
      .cart-grid { grid-template-columns: 1fr; }
    }
    .cart-table-card {
      background: var(--color-surface);
      border-radius: var(--radius-lg);
      border: var(--border-subtle);
      overflow: hidden;
    }
    .cart-table-header {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr 1fr;
      padding: var(--space-4) var(--space-6);
      background: var(--color-surface-2);
      border-bottom: var(--border-subtle);
      font-size: var(--fs-xs);
      letter-spacing: var(--ls-wide);
      text-transform: uppercase;
      color: var(--color-beige-dim);
    }
    @media (max-width: 640px) {
      .cart-table-header { display: none; }
    }
    .cart-row {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr 1fr;
      align-items: center;
      padding: var(--space-6);
      border-bottom: var(--border-subtle);
      gap: var(--space-4);
    }
    @media (max-width: 640px) {
      .cart-row {
        grid-template-columns: 80px 1fr;
        gap: var(--space-4);
      }
    }
    .cart-item-info {
      display: flex;
      align-items: center;
      gap: var(--space-4);
    }
    .cart-item-thumb {
      width: 76px;
      height: 95px;
      border-radius: var(--radius-sm);
      overflow: hidden;
      flex-shrink: 0;
      background: var(--color-surface-2);
    }
    .cart-item-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .cart-qty-ctrl {
      display: inline-flex;
      align-items: center;
      border: var(--border-subtle);
      border-radius: var(--radius-full);
      background: var(--color-surface-2);
      overflow: hidden;
    }
    .cart-qty-btn {
      background: none;
      border: none;
      color: var(--color-off-white);
      width: 32px;
      height: 32px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }
    .cart-qty-btn:hover { background: rgba(255,255,255,0.08); color: var(--color-gold); }
    .cart-qty-val {
      padding: 0 var(--space-3);
      font-size: var(--fs-sm);
      color: var(--color-off-white);
      min-width: 24px;
      text-align: center;
    }
    .cart-summary-card {
      background: var(--color-surface);
      border-radius: var(--radius-lg);
      border: var(--border-subtle);
      padding: var(--space-8);
      position: sticky;
      top: calc(var(--nav-height) + var(--space-6));
    }
    .summary-line {
      display: flex;
      justify-content: space-between;
      margin-bottom: var(--space-3);
      font-size: var(--fs-sm);
      color: var(--color-beige);
    }
    .summary-line--total {
      margin-top: var(--space-5);
      padding-top: var(--space-5);
      border-top: var(--border-subtle);
      font-family: var(--font-display);
      font-size: var(--fs-xl);
      color: var(--color-off-white);
    }
    .promo-form {
      display: flex;
      gap: var(--space-2);
      margin-top: var(--space-6);
      padding-top: var(--space-6);
      border-top: var(--border-subtle);
    }
    .promo-input {
      flex: 1;
      background: var(--color-surface-2);
      border: var(--border-subtle);
      border-radius: var(--radius-full);
      padding: var(--space-2) var(--space-4);
      color: var(--color-off-white);
      font-size: var(--fs-xs);
      outline: none;
    }
    .promo-input:focus { border-color: var(--color-gold); }
    .empty-cart-view {
      text-align: center;
      padding: var(--space-20) var(--space-4);
      background: var(--color-surface);
      border-radius: var(--radius-lg);
      border: var(--border-subtle);
    }
  </style>
</head>
<body>
  <!-- ══ NAVIGATION ══ -->
  <nav class="nav is-scrolled" role="navigation" aria-label="Main navigation">
    <div class="nav__inner">
      <a href="index.html" class="nav__logo" aria-label="Nandita Arts home">
        <span class="brand-mark" title="Nandita Albright Studio">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M7 14c-1.66 0-3 1.34-3 3 0 1.31-1.16 2-2 2 .92 1.22 2.49 2 4 2 2.21 0 4-1.79 4-4 0-1.66-1.34-3-3-3zm13.71-9.71a.996.996 0 0 0-1.41 0l-9.5 9.5c-.39.39-.39 1.02 0 1.41.39.39 1.02.39 1.41 0l9.5-9.5c.39-.39.39-1.02 0-1.41z"/>
          </svg>
        </span>
        <div class="nav__logo-text">Nandita Arts<span class="nav__logo-sub">Original Studio Art</span></div>
      </a>
      <ul class="nav__links" role="list">
        <li><a href="gallery.html" class="nav__link">Collection</a></li>
        <li><a href="/gallery?category=Abstract" class="nav__link">Abstract</a></li>
        <li><a href="/gallery?category=Landscape" class="nav__link">Landscape</a></li>
        <li><a href="/gallery?category=Gicl%C3%A9e%20Prints" class="nav__link">Prints</a></li>
        <li><a href="/#about" class="nav__link">About Nandita</a></li>
      </ul>
      <div class="nav__actions">
        <!-- Dark / Light Theme Toggle -->
        <button class="theme-toggle-btn nav__icon-btn" aria-label="Switch Theme" title="Toggle Light/Dark Gallery">
          <svg class="theme-toggle-btn__sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
          <svg class="theme-toggle-btn__moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>

        <a href="account.html" class="nav__icon-btn" aria-label="My Account" title="My Account">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </a>
        <a href="cart.html" class="nav__icon-btn is-active" aria-label="View Cart">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>
          <span class="nav__cart-badge">0</span>
        </a>
      </div>
    </div>
  </nav>

  <main class="cart-page-wrap">
    <div class="container">
      <div style="margin-bottom:var(--space-8);">
        <span class="overline">Studio Checkout</span>
        <h1 class="section__title" style="font-family:var(--font-display);font-size:clamp(2rem,4vw,3.25rem);margin-top:var(--space-2);">Your Art Cart</h1>
      </div>

      <div id="cartContentWrap">
        <!-- Filled by js/cart.js -->
      </div>
    </div>
  </main>

  <script src="js/theme.js"></script>
  <script src="js/nav.js" defer></script>
  <script src="js/animations.js" defer></script>
  <script src="js/cart.js" defer></script>
</body>
</html>
