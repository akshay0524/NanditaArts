<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Collector Account & Orders — Nandita Arts</title>
  <script>
    (function(){
      var s = localStorage.getItem('na_theme');
      var p = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', s || p);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <style>
    body { padding-top: var(--nav-height); background: var(--color-base); }
    .account-page-wrap {
      min-height: calc(100vh - var(--nav-height));
      padding-block: var(--space-12) var(--space-24);
    }
    .account-grid {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: var(--space-10);
      align-items: start;
    }
    @media (max-width: 900px) {
      .account-grid { grid-template-columns: 1fr; }
    }
    .profile-card {
      background: var(--color-surface);
      border-radius: var(--radius-lg);
      border: var(--border-subtle);
      padding: var(--space-8);
    }
    .orders-panel {
      background: var(--color-surface);
      border-radius: var(--radius-lg);
      border: var(--border-subtle);
      padding: var(--space-8);
    }
    .order-card-item {
      background: var(--color-surface-2);
      border-radius: var(--radius-md);
      border: var(--border-subtle);
      padding: var(--space-6);
      margin-bottom: var(--space-4);
    }
    .order-card-header {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: var(--space-3);
      padding-bottom: var(--space-4);
      border-bottom: var(--border-subtle);
      margin-bottom: var(--space-4);
    }
    .status-badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: var(--radius-full);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      background: rgba(207, 166, 70, 0.15);
      color: var(--color-gold);
      border: 1px solid rgba(207, 166, 70, 0.3);
    }
  </style>
</head>
<body>
  <!-- ══ NAVIGATION ══ -->
  <nav class="nav is-scrolled" role="navigation" aria-label="Main navigation">
    <div class="nav__inner">
      <a href="index.html" class="nav__logo" aria-label="Nandita Arts home">
        <span class="brand-mark" title="Nandita Albright Studio">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M7 14c-1.66 0-3 1.34-3 3 0 1.31-1.16 2-2 2 .92 1.22 2.49 2 4 2 2.21 0 4-1.79 4-4 0-1.66-1.34-3-3-3zm13.71-9.71a.996.996 0 0 0-1.41 0l-9.5 9.5c-.39.39-.39 1.02 0 1.41.39.39 1.02.39 1.41 0l9.5-9.5c.39-.39.39-1.02 0-1.41z"/>
          </svg>
        </span>
        <div class="nav__logo-text">Nandita Arts<span class="nav__logo-sub">Original Fine Art</span></div>
      </a>
      <ul class="nav__links" role="list">
        <li><a href="gallery.html" class="nav__link">Collection</a></li>
        <li><a href="cart.html" class="nav__link">Cart</a></li>
      </ul>
      <div class="nav__actions">
        <!-- Dark / Light Theme Toggle -->
        <button class="theme-toggle-btn nav__icon-btn" aria-label="Switch Theme" title="Toggle Light/Dark Gallery">
          <svg class="theme-toggle-btn__sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
          <svg class="theme-toggle-btn__moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>

        <button id="logoutBtn" class="btn btn--outline" style="padding:6px 14px;font-size:12px;">Sign Out</button>
      </div>
    </div>
  </nav>

  <main class="account-page-wrap">
    <div class="container">
      <div style="margin-bottom:var(--space-8);">
        <span class="overline" style="color:var(--color-gold);">Collector Portal</span>
        <h1 style="font-family:var(--font-display);font-size:clamp(2rem,4vw,3rem);color:var(--color-off-white);margin-top:var(--space-2);">Your Account</h1>
      </div>

      <div class="account-grid">
        <!-- Sidebar / Profile -->
        <aside class="profile-card">
          <div style="width:54px;height:54px;border-radius:50%;background:rgba(207,166,70,0.15);border:1px solid var(--color-gold);display:flex;align-items:center;justify-content:center;color:var(--color-gold);font-family:var(--font-display);font-size:22px;margin-bottom:var(--space-4);" id="avatarLetter">
            C
          </div>
          <h2 style="font-family:var(--font-display);font-size:var(--fs-lg);color:var(--color-off-white);" id="accName">Collector</h2>
          <div style="font-size:var(--fs-xs);color:var(--color-beige-dim);margin-top:4px;" id="accEmail">collector@example.com</div>
          <div style="margin-top:var(--space-2);"><span class="status-badge" id="accRole">Collector</span></div>

          <!-- Studio Dashboard Link (only visible if admin) -->
          <div id="adminLinkWrap" style="display:none;margin-top:var(--space-6);padding-top:var(--space-4);border-top:var(--border-subtle);">
            <a href="static-notice.html" class="btn btn--primary btn--wide" style="font-size:var(--fs-xs);">Access Studio Dashboard</a>
          </div>

          <div style="margin-top:var(--space-6);padding-top:var(--space-4);border-top:var(--border-subtle);">
            <button id="sidebarLogoutBtn" style="background:none;border:none;color:var(--color-gold);font-size:var(--fs-xs);cursor:pointer;padding:0;text-decoration:underline;">Sign Out of Account</button>
          </div>
        </aside>

        <!-- Orders Panel -->
        <section class="orders-panel">
          <h2 style="font-family:var(--font-display);font-size:var(--fs-xl);color:var(--color-off-white);margin-bottom:var(--space-6);">Your Acquisition History</h2>
          
          <div id="ordersContainer">
            <p style="color:var(--color-beige-dim);font-size:var(--fs-sm);">Loading your acquisitions…</p>
          </div>
        </section>
      </div>
    </div>
  </main>

  <script src="js/nav.js" defer></script>
  <script src="js/theme.js"></script>
  <script src="js/animations.js" defer></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      // Static/GitHub Pages detection
      const h = window.location.hostname;
      const IS_STATIC = h !== 'localhost' && h !== '127.0.0.1' && !h.startsWith('192.168');

      if (IS_STATIC) {
        // Show demo banner
        const banner = document.createElement('div');
        banner.setAttribute('role', 'status');
        banner.style.cssText = [
          'position:fixed','top:0','left:0','right:0','z-index:9999',
          'background:linear-gradient(90deg,#1a1400,#2a1f00)',
          'border-bottom:1px solid rgba(201,168,76,0.4)',
          'padding:10px 20px','display:flex','align-items:center','gap:12px',
          'font-size:13px','color:#e8d5a3','font-family:system-ui,sans-serif'
        ].join(';');
        banner.innerHTML = '<span style="font-size:16px;">🎨</span><span><strong style="color:#c9a84c;">Portfolio Demo Mode</strong> — Account data requires the Node.js backend. Showing a sample profile.</span>' +
          '<button onclick="this.parentElement.remove()" style="margin-left:auto;background:none;border:none;color:#c9a84c;font-size:18px;cursor:pointer;" aria-label="Dismiss">&times;</button>';
        document.body.prepend(banner);

        // Populate with logged-in or demo user data
        const savedUser = JSON.parse(sessionStorage.getItem('na_collector_user') || 'null');
        const demoUser = savedUser || { name: 'Eleanor Vance', email: 'eleanor.vance@artcollector.com', isAdmin: false };
        document.getElementById('accName').textContent = demoUser.name;
        document.getElementById('accEmail').textContent = demoUser.email;
        document.getElementById('avatarLetter').textContent = (demoUser.name || 'C')[0].toUpperCase();

        // Load demo orders (including any placed during checkout or sample artwork acquisition)
        let ordersList = JSON.parse(localStorage.getItem('na_orders') || '[]');
        const lastOrder = JSON.parse(localStorage.getItem('na_last_order') || 'null');
        if (lastOrder && !ordersList.some(o => o.id === lastOrder.id)) {
          ordersList.unshift(lastOrder);
        }
        if (ordersList.length === 0) {
          ordersList = [{
            id: 'NA-2024-8492',
            createdAt: new Date().toISOString(),
            status: 'Delivered',
            total: 1450.00,
            items: [{
              title: 'Crimson Reverie',
              dims: '30×40"',
              qty: 1,
              price: 1450,
              img: 'assets/images/p1.jpg'
            }],
            shippingAddress: {
              address: '742 Evergreen Terrace',
              city: 'San Francisco',
              state: 'CA',
              zip: '94102'
            },
            payment: { cardBrand: 'Visa', cardLast4: '4242' }
          }];
        }
        renderOrders(ordersList);
        return;
      }

      // 1. Check current session
      try {
        const authRes = await fetch('/api/auth/me');
        const authData = await authRes.json();
        if (!authData.authenticated) {
          window.location.href = 'login.html';
          return;
        }

        const user = authData.user;
        document.getElementById('accName').textContent = user.name || 'Collector';
        document.getElementById('accEmail').textContent = user.email;
        document.getElementById('avatarLetter').textContent = (user.name || user.email)[0].toUpperCase();

        if (user.isAdmin) {
          document.getElementById('accRole').textContent = 'Artist & Admin';
          document.getElementById('adminLinkWrap').style.display = 'block';
        }


        // 2. Fetch Orders
        const orderRes = await fetch('/api/orders/my-orders');
        if (orderRes.ok) {
          const orderData = await orderRes.json();
          renderOrders(orderData.orders || []);
        } else {
          renderOrders([]);
        }
      } catch (err) {
        console.error(err);
      }

      function renderOrders(orders) {
        const container = document.getElementById('ordersContainer');
        if (!orders || orders.length === 0) {
          container.innerHTML = `
            <div style="text-align:center;padding:var(--space-12) var(--space-4);color:var(--color-beige-dim);">
              <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="margin:0 auto var(--space-3);opacity:0.6;">
                <circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>
              </svg>
              <h3 style="font-family:var(--font-display);font-size:var(--fs-lg);color:var(--color-off-white);margin-bottom:var(--space-2);">No Orders Found Yet</h3>
              <p style="font-size:var(--fs-xs);max-width:360px;margin:0 auto var(--space-5);">When you acquire original artworks or prints, your order receipts and delivery tracking updates will be displayed here.</p>
              <a href="gallery.html" class="btn btn--outline" style="font-size:var(--fs-xs);">Browse Original Art</a>
            </div>
          `;
          return;
        }

        container.innerHTML = orders.map(o => `
          <div class="order-card-item">
            <div class="order-card-header">
              <div>
                <strong style="color:var(--color-off-white);font-family:var(--font-display);font-size:var(--fs-md);">Order #${o.id}</strong>
                <div style="font-size:var(--fs-xs);color:var(--color-beige-dim);margin-top:2px;">Placed on ${new Date(o.createdAt).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' })}</div>
              </div>
              <div style="text-align:right;">
                <span class="status-badge">${o.status}</span>
                <div style="font-size:var(--fs-md);color:var(--color-gold);font-weight:500;margin-top:4px;">$${Number(o.total).toLocaleString('en-US', { minimumFractionDigits: 2 })}</div>
              </div>
            </div>
            <div>
              ${o.items.map(item => `
                <div style="display:flex;align-items:center;gap:var(--space-3);margin-bottom:var(--space-3);">
                  <img src="${item.img}" alt="${item.title}" style="width:40px;height:50px;object-fit:cover;border-radius:2px;">
                  <div style="flex:1;">
                    <div style="font-size:var(--fs-sm);color:var(--color-off-white);">${item.title}</div>
                    <div style="font-size:var(--fs-xs);color:var(--color-beige-dim);">${item.dims} · Qty: ${item.qty}</div>
                  </div>
                  <div style="font-size:var(--fs-sm);color:var(--color-beige);">$${(item.price * item.qty).toLocaleString()}</div>
                </div>
              `).join('')}
            </div>
            <div style="margin-top:var(--space-3);padding-top:var(--space-3);border-top:var(--border-subtle);font-size:var(--fs-xs);color:var(--color-beige-dim);display:flex;justify-content:space-between;flex-wrap:wrap;gap:var(--space-2);">
              <div>Shipping to: ${o.shippingAddress.address}, ${o.shippingAddress.city}, ${o.shippingAddress.state} ${o.shippingAddress.zip}</div>
              <div>Payment: ${o.payment?.cardBrand || 'Card'} •••• ${o.payment?.cardLast4 || '4242'}</div>
            </div>
          </div>
        `).join('');
      }

      // Logout handlers
      async function handleLogout() {
        if (!window.location.hostname.includes('localhost') && !window.location.hostname.includes('127.0.0.1')) {
          window.location.href = 'index.html';
          return;
        }
        await fetch('/api/auth/logout', { method: 'POST' });
        window.location.href = 'index.html';
      }
      document.getElementById('logoutBtn')?.addEventListener('click', handleLogout);
      document.getElementById('sidebarLogoutBtn')?.addEventListener('click', handleLogout);
    });
  </script>
</body>
</html>
