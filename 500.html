<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Studio Interruption — Nandita Arts</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <style>
    body {
      padding-top: var(--nav-height);
      background: var(--color-base);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .err-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: var(--space-16) var(--space-4);
    }
    .err-card { max-width: 520px; }
  </style>
</head>
<body>
  <nav class="nav is-scrolled" role="navigation">
    <div class="nav__inner">
      <a href="index.html" class="nav__logo">
        <div class="nav__logo-text">Nandita Arts<span class="nav__logo-sub">Original Studio Art</span></div>
      </a>
      <ul class="nav__links">
        <li><a href="gallery.html" class="nav__link">Collection</a></li>
      </ul>
    </div>
  </nav>

  <main class="err-wrap">
    <div class="err-card">
      <div style="font-family:var(--font-display);font-size:clamp(4rem,8vw,6rem);color:var(--color-gold);line-height:1;margin-bottom:var(--space-2);font-weight:300;">500</div>
      <span class="overline" style="color:var(--color-gold);">Studio System Notice</span>
      <h1 style="font-family:var(--font-display);font-size:var(--fs-2xl);color:var(--color-off-white);margin-top:var(--space-2);margin-bottom:var(--space-4);">A Moment in the Studio</h1>
      <p style="color:var(--color-beige);font-size:var(--fs-sm);line-height:var(--lh-relaxed);margin-bottom:var(--space-8);">
        Our studio servers encountered an unexpected delay while processing your request. Please refresh or try again in a few moments.
      </p>
      <div style="display:flex;gap:var(--space-4);justify-content:center;flex-wrap:wrap;">
        <button onclick="window.location.reload()" class="btn btn--primary btn--lg">Refresh Page</button>
        <a href="index.html" class="btn btn--outline btn--lg">Return Home</a>
      </div>
    </div>
  </main>
</body>
</html>
